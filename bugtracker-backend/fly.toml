# fly.toml app configuration file generated for bugtracker-backend-prod-lzy95 on 2026-11-25T11:13:46+08:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'bugtracker-backend-prod-lzy95'
primary_region = 'sin'

[build]
[env]
  DB_PATH = '/data/bugs.db'

[[mounts]]
  source = 'bugtracker_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
