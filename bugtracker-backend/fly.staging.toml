# fly.toml app configuration file generated for bugtracker-backend-radiant-lzy95-3887 on 2026-11-24T08:30:02+08:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'bugtracker-backend-staging-lzy95'
primary_region = 'sin'

[build]

[mounts]
  source="bugtracker_data"
  destination="/data"

[env]
  DB_PATH = "/data/bugs.db"

[build.args]
  NEXT_PUBLIC_API_URL = "https://bugtracker-backend-staging-lzy95.fly.dev/"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
